[project]
name = "omada-docs"
version = "0.1.0"
description = "Read-only documentation platform for TP-Link Omada networks"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "weasyprint>=62",
  "python-docx>=1.1",
  "cairosvg>=2.7",
  "markdown>=3.6",
  "bleach>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017"]
